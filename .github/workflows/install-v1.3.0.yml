name: Install uploaded PGE Net-Billing v1.4.1 for HACS
on:
  push:
    branches: [main]
    paths:
      - 'pge_net_billing-1.4.1.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract user's v1.4.1 archive and preserve official PGE logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          archive = Path('pge_net_billing-1.4.1.zip')
          assert archive.is_file(), 'Uploaded ZIP not found'
          logo = Path('custom_components/pge_net_billing/frontend/pge-logo.svg')
          original_logo = logo.read_bytes()
          with ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              paths = {}
              for name in names:
                  parts = Path(name).parts
                  assert '..' not in parts and not name.startswith('/'), name
                  idx = next((i for i in range(len(parts)-1) if parts[i:i+2] == ('custom_components', 'pge_net_billing')), None)
                  if idx is not None:
                      dest = Path(*parts[idx:])
                  elif len(parts) >= 2 and parts[0] == 'pge_net_billing':
                      dest = Path('custom_components') / Path(*parts)
                  elif name in ('README.md', 'hacs.json'):
                      dest = Path(name)
                  else:
                      continue
                  if dest == logo:
                      continue
                  paths[str(dest)] = name
              manifest = 'custom_components/pge_net_billing/manifest.json'
              assert manifest in paths, 'Missing manifest.json in ZIP'
              data = json.loads(z.read(paths[manifest]))
              assert data['version'] == '1.4.1', 'ZIP version must be 1.4.1'
              for dest, source in paths.items():
                  p = Path(dest)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(z.read(source))
          assert logo.read_bytes() == original_logo, 'PGE logo must remain unchanged'
          print('Installed', len(paths), 'files from user ZIP; official PGE logo preserved')
          PY
      - name: Commit v1.4.1 integration for HACS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/pge_net_billing README.md hacs.json
          if ! git diff --cached --quiet; then
            git commit -m "Install user's PGE Net-Billing v1.4.1 for HACS"
            git push
          fi

      - name: Publish GitHub release 1.4.1 for HACS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 1.4.1 >/dev/null 2>&1; then
            echo "Release 1.4.1 already exists"
          else
            gh release create 1.4.1 --target "$(git rev-parse HEAD)" --title "1.4.1" --notes "PGE Net-Billing 1.4.1" --latest
          fi
